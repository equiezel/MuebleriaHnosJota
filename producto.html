<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">

	<meta name="description" content="Detalle de producto de Hermanos Jota, muebles con historia para vivirlos hoy.">
	<title>Detalle de producto | Hermanos Jota</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/producto.css">

<body>
	<a class="saltar-al-contenido" href="#contenido">Saltar al contenido</a>

	<header class="site-header">

			<nav class="nav-principal" aria-label="Navegación principal">
